  <path d="M47 35a15 15 0 0 1-25.6 9.6" fill="none" stroke="url(#cyan)" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M19.6 49.4l1.2-6.9 6.9 1.2" fill="none" stroke="url(#cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
